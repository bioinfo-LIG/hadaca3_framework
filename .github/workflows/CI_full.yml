
on:
  schedule:
    - cron: '0 2 * * *'  # Trigger daily at 2 AM UTC
  workflow_dispatch:
    
jobs:
  check_date:
    # if: false 
    runs-on: self-hosted
    timeout-minutes: 5760  
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v2
      - name: print latest_commit
        run: echo ${{ github.sha }}
      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list  --after="24 hours"  ${{ github.sha }}) && echo "::set-output name=should_run::false"

  CI_full_Pipeline_scheduled:
    # if : false
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: self-hosted
    timeout-minutes: 5760  
    env:
      CONDA: "/home/ubuntu/miniconda3/etc/profile.d/conda.sh"
      CONDA_ENV_NAME: "hadaca3framework_env"
      DATA_DIR: "/home/github-runner/projects/hadaca3_framework/data/" 
      SNK_CORES: "2"
      MEM_MB: "32000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
            
      - name: Set PAT
        run: echo "GITHUB_PAT=${{ secrets.PAT_CI }}" >> $GITHUB_ENV
        
      - name: Execute commands from README
        run: |
          source "${{ env.CONDA }}"
            awk '/```{Automatic CI-conda}/{f=1; next} f && /```/{f=0; exit} f' README.md | while read -r line; do
            [[ "$line" =~ ^# ]] && continue
            [ -z "$line" ] || [[ "$line" =~ conda\ create ]] && continue
            echo "$line"
            eval "$line"
          done
      
      - name: Link data
        run: |
          mkdir data
          cd data
          ln -s ${{ env.DATA_DIR }}* .

      - name: Run test pipeline
        run: |
          source "${{ env.CONDA }}" 
          conda activate ${{ env.CONDA_ENV_NAME }}
          nextflow run 00_run_pipeline.nf --setup_folder function_metadata_and_selection/Local_test_setup/

